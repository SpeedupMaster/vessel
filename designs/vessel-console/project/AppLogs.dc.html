<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Vessel · n8n · 日志</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F4F5F7;color:#0E1116;font-family:'Geist','PingFang SC','Microsoft YaHei',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
a{color:#2F5BEA;text-decoration:none}a:hover{color:#1E3FB0}
button,input,select{font:inherit}
button{cursor:pointer}
.btn{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 16px;border-radius:8px;border:1px solid #D5DAE1;background:#FFFFFF;color:#0E1116;font-size:14px;font-weight:500;white-space:nowrap}
.btn:hover{background:#EEF0F3;color:#0E1116}
.btn-primary{background:#0E1116;border-color:#0E1116;color:#FFFFFF}
.btn-primary:hover{background:#2A2F37;color:#FFFFFF}
.navlink{display:flex;align-items:center;gap:10px;height:40px;padding:0 12px;border-radius:8px;color:#3D4452;font-size:14px;font-weight:500}
.navlink:hover{background:#ECEEF2;color:#0E1116}
.tab{display:inline-flex;align-items:center;height:44px;padding:0 4px;font-size:14px;font-weight:500;color:#5B6472;border-bottom:2px solid transparent}
.tab:hover{color:#0E1116}
.mono{font-family:'Geist Mono',ui-monospace,monospace}
.sel{height:40px;padding:0 10px;border:1px solid #D5DAE1;border-radius:8px;background:#FFFFFF;font-size:13px}
</style>
</helmet>
<div style="display: flex; flex-wrap: wrap; min-height: 100vh; width: 100%">

<aside style="flex: 1 1 248px; max-width: 100%; background: #FBFBFC; border-right: 1px solid #E3E6EB; padding: 20px 14px; display: flex; flex-direction: column; gap: 22px">
<div style="display: flex; align-items: center; gap: 10px; padding: 0 6px">
<div style="width: 32px; height: 32px; border-radius: 8px; background: #0E1116; display: flex; align-items: center; justify-content: center">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 14l9 6 9-6M12 3v11M7 9h10"></path></svg>
</div>
<div style="display: flex; flex-direction: column">
<span style="font-weight: 600; font-size: 15px">Vessel</span>
<span style="font-size: 12px; color: #5B6472">vps-tokyo-01</span>
</div>
</div>
<button type="button" style="display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 12px; border: 1px solid #DDE1E7; border-radius: 8px; background: #FFFFFF; color: #5B6472; font-size: 13px">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
<span style="flex: 1; text-align: left">搜索或跳转…</span>
<span class="mono" style="font-size: 11px; border: 1px solid #DDE1E7; border-radius: 4px; padding: 1px 5px">⌘K</span>
</button>
<nav aria-label="主导航" style="display: flex; flex-direction: column; gap: 18px">
<sc-for list="{{nav}}" as="group" hint-placeholder-count="3">
<div style="display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 12px; font-weight: 500; color: #5B6472; padding: 0 12px 6px">{{group.label}}</span>
<sc-for list="{{group.items}}" as="item" hint-placeholder-count="3">
<a class="navlink" href="{{item.href}}" style="{{item.style}}">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{item.d}}"></path></svg>
<span style="flex: 1">{{item.label}}</span>
<span style="font-size: 12px; color: #5B6472">{{item.count}}</span>
</a>
</sc-for>
</div>
</sc-for>
</nav>
<div style="margin-top: auto; display: flex; flex-direction: column; gap: 10px; padding: 12px; border: 1px solid #E3E6EB; border-radius: 10px; background: #FFFFFF">
<div style="display: flex; align-items: center; gap: 8px; font-size: 13px">
<span style="width: 8px; height: 8px; border-radius: 50%; background: #16A34A"></span>
<span style="font-weight: 500">Docker 已连接</span>
<span style="margin-left: auto; color: #5B6472; font-size: 12px">27.3.1</span>
</div>
<div style="display: flex; align-items: center; justify-content: space-between; font-size: 12px; color: #5B6472">
<span>Vessel v1.0.18</span>
<a href="Settings.dc.html" style="font-size: 12px; font-weight: 500">有新版本 v1.0.19</a>
</div>
</div>
</aside>

<main style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column">
<div style="background: #FFFFFF; border-bottom: 1px solid #E3E6EB">
<div style="max-width: 1180px; margin: 0 auto; padding: 20px 32px 0; display: flex; flex-direction: column; gap: 14px">
<div style="font-size: 13px; color: #5B6472"><a href="Apps.dc.html" style="color: #5B6472">应用</a> / n8n</div>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 16px">
<span class="mono" style="width: 44px; height: 44px; border-radius: 10px; background: #F0F2F5; color: #3D4452; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 500">N8</span>
<div style="flex: 1 1 300px; display: flex; flex-direction: column; gap: 4px; min-width: 0">
<div style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap">
<h1 style="margin: 0; font-size: 24px; font-weight: 600">n8n</h1>
<span style="display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 500; color: #0F7A43; background: #E6F4EC; border-radius: 999px; padding: 3px 10px"><span style="width: 6px; height: 6px; border-radius: 50%; background: currentColor"></span>运行中 · 部署 #30</span>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 14px; font-size: 13px; color: #5B6472">
<a href="https://flow.example.com" class="mono" style="font-size: 12px">flow.example.com ↗</a>
<span>Compose · 3 个服务</span>
</div>
</div>
<div style="display: flex; gap: 8px; flex-wrap: wrap">
<button type="button" class="btn">停止</button>
<button type="button" class="btn">重启</button>
<button type="button" class="btn btn-primary">重新部署</button>
</div>
</div>
<nav aria-label="应用页签" style="display: flex; gap: 24px; overflow-x: auto">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="6">
<a class="tab" href="{{t.href}}" style="{{t.style}}">{{t.label}}</a>
</sc-for>
</nav>
</div>
</div>

<div style="width: 100%; max-width: 1180px; margin: 0 auto; padding: 24px 32px 56px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px">
<div style="position: relative; flex: 1 1 240px; max-width: 320px">
<label for="ls" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">搜索日志</label>
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5B6472" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="position: absolute; left: 12px; top: 12px"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
<input id="ls" type="search" value="worker" style="width: 100%; height: 40px; padding: 0 12px 0 36px; border: 1px solid #D5DAE1; border-radius: 8px; background: #FFFFFF; font-size: 14px">
</div>
<label style="display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: #3D4452">服务<select class="sel"><option>全部（3）</option><option>n8n</option><option>n8n-worker</option><option>redis</option></select></label>
<label style="display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: #3D4452">时间<select class="sel"><option>最近 1 小时</option><option>最近 15 分钟</option><option>最近 24 小时</option><option>全部</option></select></label>
<div role="group" aria-label="日志级别" style="display: inline-flex; gap: 6px">
<sc-for list="{{levels}}" as="lv" hint-placeholder-count="4">
<button type="button" aria-pressed="{{lv.on}}" style="height: 36px; padding: 0 12px; border-radius: 999px; font-size: 12px; font-weight: 500; {{lv.style}}">{{lv.label}} <span class="mono">{{lv.n}}</span></button>
</sc-for>
</div>
</div>

<div style="border: 1px solid #1F242C; border-radius: 12px; overflow: hidden">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 8px 10px 8px 16px; background: #171B21; border-bottom: 1px solid #262B33; font-size: 12px; color: #9AA3AF">
<span style="display: inline-flex; align-items: center; gap: 6px; color: #7EE2A8"><span style="width: 7px; height: 7px; border-radius: 50%; background: #7EE2A8"></span>实时</span>
<span>显示 14 / 1,284 行 · 匹配 “worker”</span>
<div style="margin-left: auto; display: flex; gap: 4px">
<button type="button" style="height: 32px; padding: 0 10px; border: 1px solid #333944; border-radius: 6px; background: transparent; color: #C9CED6; font-size: 12px">暂停</button>
<button type="button" style="height: 32px; padding: 0 10px; border: 1px solid #333944; border-radius: 6px; background: transparent; color: #C9CED6; font-size: 12px">换行</button>
<button type="button" style="height: 32px; padding: 0 10px; border: 1px solid #333944; border-radius: 6px; background: transparent; color: #C9CED6; font-size: 12px">下载</button>
<button type="button" style="height: 32px; padding: 0 10px; border: 1px solid #333944; border-radius: 6px; background: transparent; color: #C9CED6; font-size: 12px">全屏</button>
</div>
</div>
<div class="mono" style="background: #0F1217; color: #C9CED6; font-size: 12.5px; line-height: 22px; padding: 10px 0; overflow-x: auto; min-height: 520px">
<sc-for list="{{log}}" as="l" hint-placeholder-count="14">
<div style="display: flex; white-space: pre; padding: 0 16px; {{l.bg}}">
<span style="width: 92px; flex: 0 0 92px; color: #5C6370">{{l.t}}</span>
<span style="width: 104px; flex: 0 0 104px; {{l.sc}}">{{l.s}}</span>
<span style="width: 52px; flex: 0 0 52px; {{l.lc}}">{{l.lv}}</span>
<span>{{l.m}}</span>
</div>
</sc-for>
<div style="padding: 10px 16px 0; color: #5C6370">▍ 等待新输出…</div>
</div>
</div>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#2F5BEA","options":["#2F5BEA","#0E7C66","#C2410C","#6D28D9"]},"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#2F5BEA';
    const active = 'apps';
    const I = {
      overview: 'M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z',
      apps: 'M12 3l8 4.5v9L12 21l-8-4.5v-9zM12 12l8-4.5M12 12v9M12 12L4 7.5',
      domains: 'M12 3a9 9 0 1 0 0 18a9 9 0 1 0 0-18zM3 12h18M12 3c2.5 2.5 3.8 5.5 3.8 9s-1.3 6.5-3.8 9M12 3c-2.5 2.5-3.8 5.5-3.8 9s1.3 6.5 3.8 9',
      backups: 'M7 18a5 5 0 1 1 1-9.9A6 6 0 0 1 19 10a4 4 0 0 1-1 8M12 12v8M9 15l3-3 3 3',
      maint: 'M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.4-.6-.6-2.4z',
      reg: 'M6 11h12v10H6zM8 11V7a4 4 0 0 1 8 0v4',
      bell: 'M6 16v-5a6 6 0 0 1 12 0v5l2 2H4zM10 21h4',
      user: 'M12 12a4 4 0 1 0 0-8a4 4 0 0 0 0 8zM4 21c1.5-4 4.5-6 8-6s6.5 2 8 6'
    };
    const mk = (id, label, href, count) => ({ label, href, d: I[id], count: count || '',
      style: id === active ? 'background:#FFFFFF;color:' + accent + ';box-shadow:0 0 0 1px #E3E6EB' : '' });
    const nav = [
      { label: '工作区', items: [mk('overview', '概览', 'Main.dc.html'), mk('apps', '应用', 'Apps.dc.html', '12'), mk('domains', '域名与证书', 'Domains.dc.html', '8')] },
      { label: '运维', items: [mk('backups', '备份', 'Backups.dc.html'), mk('maint', '维护', 'Maintenance.dc.html', '3')] },
      { label: '设置', items: [mk('reg', '镜像仓库', 'Settings.dc.html'), mk('bell', '通知渠道', 'Settings.dc.html'), mk('user', '账户与面板', 'Settings.dc.html')] }
    ];
    const tabActive = '日志';
    const tabs = [['概览', 'AppOverview.dc.html'], ['编排', 'AppCompose.dc.html'], ['部署', 'AppDeployments.dc.html'], ['日志', 'AppLogs.dc.html'], ['备份', 'Backups.dc.html'], ['设置', 'AppSettings.dc.html']]
      .map(t => ({ label: t[0], href: t[1], style: t[0] === tabActive ? 'color:#0E1116;border-bottom-color:' + accent : '' }));
    const on = 'border:1px solid #0E1116;background:#0E1116;color:#FFFFFF', off = 'border:1px solid #D5DAE1;background:#FFFFFF;color:#3D4452';
    const levels = [['错误', '3', true], ['警告', '5', true], ['信息', '1,190', true], ['调试', '86', false]]
      .map(l => ({ label: l[0], n: l[1], on: l[2] ? 'true' : 'false', style: l[2] ? on : off }));
    const svcC = { 'n8n': 'color:#8EA8FF', 'n8n-worker': 'color:#C4A5FF', 'redis': 'color:#7DD3C0' };
    const lvC = { INFO: 'color:#7D8590', WARN: 'color:#F7C266', ERROR: 'color:#FF8A80' };
    const L = (t, s, lv, m) => ({ t, s, sc: svcC[s], lv, lc: lvC[lv], m, bg: lv === 'ERROR' ? 'background:rgba(255,138,128,.08)' : '' });
    const log = [
      L('09:14:02.118', 'n8n-worker', 'INFO', 'n8n worker is now ready'),
      L('09:14:02.120', 'n8n-worker', 'INFO', ' * Version: 1.71.3'),
      L('09:14:02.121', 'n8n-worker', 'INFO', ' * Concurrency: 10'),
      L('09:14:02.402', 'n8n', 'INFO', 'Registered worker n8n-worker-1 (queue mode)'),
      L('09:16:47.913', 'n8n-worker', 'INFO', 'Worker started execution 48213 (job 9921)'),
      L('09:16:49.207', 'n8n-worker', 'INFO', 'Worker finished execution 48213 (job 9921)'),
      L('09:21:05.551', 'n8n-worker', 'WARN', 'Job 9934 stalled, will be retried by worker'),
      L('09:21:06.012', 'redis', 'INFO', '1 changes in 60 seconds. Saving...'),
      L('09:21:35.118', 'n8n-worker', 'ERROR', 'Execution 48227 failed: ETIMEDOUT api.example.net:443'),
      L('09:21:35.120', 'n8n-worker', 'ERROR', '    at TLSSocket.onConnectTimeout (node:_tls_wrap:1638:10)'),
      L('09:22:00.004', 'n8n-worker', 'INFO', 'Worker started execution 48228 (job 9935)'),
      L('09:22:00.871', 'n8n-worker', 'INFO', 'Worker finished execution 48228 (job 9935)'),
      L('09:24:13.660', 'n8n-worker', 'WARN', 'Memory usage 512 MB exceeds soft limit 480 MB'),
      L('09:25:41.307', 'n8n-worker', 'ERROR', 'Execution 48231 failed: Workflow "日报汇总" node "HTTP Request" 502')
    ];
    return { accent, nav, tabs, levels, log };
  }
}
</script>
</body>
</html>
